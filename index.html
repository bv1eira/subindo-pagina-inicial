<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Paraíso</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f6f8;
            color: #333;
        }


        .topo {
            position: relative;
        }

        .logohotel {
            position: absolute;
            left: 20px;
            top: 20px;
            width: 140px;
        }

        .menu-topo {
            position: absolute;
            right: 20px;
            top: 20px;
        }

        .botaoreserva {

            position: absolute;
            left: 769px;
            bottom: 20px;

        }
        
        .menu-topo ul {
            list-style: none;
            display: flex;
            gap: 10px;
        }
        
        .menu-topo a {
            text-decoration: none;
            background: white;
            color: #1e3c72;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
        }

        
        .menu-topo a:hover {
            background-color: #ffe8be;
            color: white;
        }

        .banner {
            background: linear-gradient(135deg, rgb(96, 153, 179), rgb(28, 64, 132));
            color: #fff;
            text-align: center;
            padding: 90px 20px 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .banner a {

            text-decoration: none;
            background: white;
            color: #1e3c72;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
            margin-top: 30px;

        }

        .banner a:hover {

            background-color: #ffe8be;
            color: white;
        }

        .banner h1 {
            font-size: 2.2rem;
        }

        .banner p {
            font-size: 1rem;
        }

        .conteudo {
            padding: 40px 15px;
        }

        .destaque {
            background-color: #ffe8bf;
            padding: 25px;
            border-radius: 12px;
            max-width: 1500px;
            margin: auto;
            text-align: center;
        }

        .destaque h2 {
            color: #1e3c72;
            margin-bottom: 15px;
        }

        .grid,
        .grid2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .card {
            background: white;
            padding: 10px;
            border-radius: 10px;
            transition: 0.3s;
        }

        .card:hover {
            transform: scale(1.05);
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 10px;
        }

        .card label {
            display: block;
            margin-top: 8px;
            font-weight: bold;
        }

        .popup {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            justify-content: center;
            align-items: center;
        }

        .popup-content {
            background: #ffe8bf;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
        }

        .popup-content button {
            margin-top: 15px;
            padding: 10px 20px;
            border: none;
            background: #1e3c72;
            color: white;
            border-radius: 8px;
            cursor: pointer;
        }

        @media (max-width: 768px) {

            .menu-topo ul {
                flex-direction: column;
                align-items: flex-end;
            }

            .logohotel {
                width: 100px;
                top: 10px;
                left: 10px;
            }

            .menu-topo {
                top: 10px;
                right: 10px;
            }

            .banner {
                padding-top: 80px;
            }
        }
    </style>
</head>

<body>

    <div id="boasVindas" class="popup">
        <div class="popup-content">
            <h2>Bem-vindo!</h2>
            <p>Seja bem-vindo ao Hotel Paraíso.<br>
                Aproveite uma experiência única.</p>
            <button onclick="fecharPopup()">Entrar</button>
        </div>
    </div>

    <header class="topo">

        <img src="image/logo-hotel-paraiso.png" class="logohotel">

        <nav class="menu-topo">
            <ul>
                <li><a href="home.html">Home</a></li>
                <li><a href="quartos.html">Quartos</a></li>
                <li><a href="hospedes.html">Hóspedes</a></li>
                <li><a href="localizacao.html">Localização</a></li>
                <li><a href="galeria.html">Galeria</a></li>
                <li><a href="reservas.html">Reservas</a></li>
            </ul>
        </nav>

        <div class="banner">
            <h1>Bem-Vindo ao Hotel Paraíso</h1>
            <p>Conforto, tranquilidade e uma experiência inesquecível.</p>
            <a href="reservas.html">Faça sua Reserva</a>
        </div>

        <!-- <nav class="botaoreserva">
            <ul>
                <li><a href="reservas.html">Faça sua Reserva</a></li>
            </ul>
        </nav> -->

    </header>

    <main class="conteudo">

        <section class="destaque">

            <h2>Quartos</h2>

            <div class="grid">
                <div class="card">
                    <img src="image/image2.jpg">
                    <label>Quarto Luxo</label>
                </div>

                <div class="card">
                    <img src="image/image5.jpg">
                    <label>Quarto Casal</label>
                </div>

                <div class="card">
                    <img src="image/image6.jpg">
                    <label>Suíte Master</label>
                </div>
            </div><br>

            <h2>Área do hotel</h2>

            <div class="grid2">
                <div class="card">
                    <img src="image/image1.jpg">
                    <label>Piscina</label>
                </div>

                <div class="card">
                    <img src="image/image11.png">
                    <label>Restaurante</label>
                </div>

                <div class="card">
                    <img src="image/image12.jpeg">
                    <label>Jardim</label>
                </div>
            </div>

        </section>

    </main>

    <script>
        function fecharPopup() {
            document.getElementById("boasVindas").style.display = "none";
        }

        window.onload = function () {
            document.getElementById("boasVindas").style.display = "flex";
        }
    </script>

</body>

</html>
